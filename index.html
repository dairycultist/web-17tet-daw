<!DOCTYPE html>
<html>
<head>
	<meta charset="UTF-8">
	<title>17-TET DAW</title>
	<script>

		let render;
		let t = 0;
		let degree = 17*8;
		let beats_per_bar = 16;

		function start() {

			document.getElementById("start").style.display = "none";

			const canvas = document.getElementById("canvas");
			render = canvas.getContext("2d");

			rerender();

			canvas.addEventListener("click", (event) => {

				const x = event.offsetX / canvas.offsetWidth * canvas.width;
				const y = event.offsetY / canvas.offsetHeight * canvas.height;

				const { beat, note } = pos_to_beatnote(x, y);

				alert("beat: " + beat + "\nnote: " + note);

				rerender();
			});

			const audioContext = new (window.AudioContext || window.webkitAudioContext)();
			const scriptProcessor = audioContext.createScriptProcessor(256, 1, 1); // generates audio data with 256 samples

			scriptProcessor.connect(audioContext.destination); // connect to speaker

			scriptProcessor.onaudioprocess = function (event) {

				const output = event.outputBuffer.getChannelData(0);

				for (let i = 0; i < output.length; i++) {

					output[i] = Math.sin(Math.pow(2.0, degree / 17.0) * 2.0 * Math.PI * (t + i) / audioContext.sampleRate);
				}
				t += output.length;
			};
		}

		function beatnote_to_rect(beat, note) {

			const this_x = Math.floor(beat * 300 / beats_per_bar) + 1;
			const next_x = Math.floor((beat + 1) * 300 / beats_per_bar) + 1;

			return {
				x: this_x,
				y: (17 + 17 - note) * 10 + 1,
				w: next_x - this_x - 1,
				h: 9
			};
		}

		function pos_to_beatnote(x, y) {

			return {
				beat: Math.floor((x - 1) * beats_per_bar / 300),
				note: Math.ceil((1 - y) / 10 + 17 + 17)
			};
		}

		function rerender() {

			render.fillStyle = "grey";
			render.fillRect(0, 0, 301, 10 * (17 + 17 + 1) + 1);

			for (let beat = 0; beat < beats_per_bar; beat++) {

				for (let note = 0; note < 17 + 17 + 1; note++) {

					if (note % 17 == 0) {
						render.fillStyle = "orange";
					} else if (note % 17 == 10) {
						render.fillStyle = "lightBlue";
					} else {
						render.fillStyle = "lightGrey";
					}

					const rect = beatnote_to_rect(beat, note);

					render.fillRect(rect.x, rect.y, rect.w, rect.h);
				}
			}
		}
	</script>
</head>
<body style="margin: 0;">
	<canvas id="canvas" width="800" height="400" style="width: 100%; image-rendering: pixelated;"></canvas>
	<button id="start" style="position: absolute; left: 50%; top: 50%; font-size: 50px; transform: translate(-50%, -50%); font-family: monospace;" onclick="start();">Start</button>
</body>
</html>
