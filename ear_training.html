<!DOCTYPE html>
<html>
<head>
	<meta charset="UTF-8">
	<title>17-TET DAW</title>
	<script>

		let t = 0;
		let base_octave = 7;

		let root_note = 0;
		let interval = 10;
		let note_state = 0; // 0 for playing root note, 1 for playing interval above root, 2 for no playing

		function start() {

			document.getElementById("start").style.display = "none";
			document.getElementById("content").style.display = "block";

			const audioContext = new (window.AudioContext || window.webkitAudioContext)();
			const scriptProcessor = audioContext.createScriptProcessor(256, 1, 1); // generates audio data with 256 samples

			scriptProcessor.connect(audioContext.destination); // connect to speaker

			scriptProcessor.onaudioprocess = (event) => {

				let note;

				switch (note_state) {
					case 0: note = root_note; break;
					case 1: note = root_note + interval; break;
					default: return;
				}

				const output = event.outputBuffer.getChannelData(0);

				for (let i = 0; i < output.length; i++) {

					const signal = Math.sign(Math.sin(Math.pow(2.0, (note + base_octave * 17) / 17.0) * 2.0 * Math.PI * (t + i) / audioContext.sampleRate));
					let amplitude = 0.3;

					output[i] = signal * amplitude;
				}

				t += output.length;

				if (t > 30000) {
					note_state++;
					t = 0;
				}
			};
		}

		function selectAnswer(answer) {

			alert("WRONG! " + answer);
		}
	</script>
	<style>
		button { padding: 1em; font: inherit; }
	</style>
</head>
<body style="margin: 0; font-family: sans-serif; font-size: 18px;">

	<button type="button" id="start" style="position: absolute; left: 50%; top: 50%; font-size: 50px; transform: translate(-50%, -50%); font-family: monospace;" onclick="start();">Start</button>

	<div style="display: none; margin: auto; width: 50em;" id="content">
		<br>
		<div style="display: grid; grid-template-columns: 1fr 1fr 1fr 1fr 1fr;">
			<button type="button" onclick="selectAnswer(0);">Unison</button>
			<div></div>
			<button type="button" onclick="selectAnswer(7);">perfect 4th</button>
			<div></div>
			<div></div>

			<button type="button" onclick="selectAnswer(1);">minor 2nd</button>
			<button type="button" onclick="selectAnswer(4);">minor 3rd</button>
			<button type="button" onclick="selectAnswer(8);">diminished 5th</button>
			<button type="button" onclick="selectAnswer(11);">minor 6th</button>
			<button type="button" onclick="selectAnswer(14);">minor 7th</button>

			<button type="button" onclick="selectAnswer(2);">neutral 2nd</button>
			<button type="button" onclick="selectAnswer(5);">neutral 3rd</button>
			<div></div>
			<button type="button" onclick="selectAnswer(12);">neutral 6th</button>
			<button type="button" onclick="selectAnswer(15);">neutral 7th</button>

			<button type="button" onclick="selectAnswer(3);">major 2nd</button>
			<button type="button" onclick="selectAnswer(6);">major 3rd</button>
			<button type="button" onclick="selectAnswer(9);">augmented 4th</button>
			<button type="button" onclick="selectAnswer(13);">major 6th</button>
			<button type="button" onclick="selectAnswer(16);">major 7th</button>
			
			<div></div>
			<div></div>
			<button type="button" onclick="selectAnswer(10);">perfect 5th</button>
			<div></div>
			<button type="button" onclick="selectAnswer(17);">Octave</button>
		</div>
		<br>
		<button type="button" style="width: 100%;">Play again</button>
	</div>

</body>
</html>
