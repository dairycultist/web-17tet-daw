<!DOCTYPE html>
<html>
<head>
	<meta charset="UTF-8">
	<title>17-TET DAW</title>
	<script>

		let render;
		let t = 0;

		let base_octave = 7;

		let beats_per_bar = 16;
		let bpm = 240;

		let playing = false;
		let cursor = -1;
		let cursor_move_t = 0;

		let selected_t = 0; // for playing audio upon selecting
		let selected_note;

		const notes = [];

		function start() {

			document.getElementById("start").style.display = "none";

			const canvas = document.getElementById("canvas");
			render = canvas.getContext("2d");

			rerender();

			document.addEventListener("keydown", (event) => {

				if (event.key === ' ') {
					playing = !playing;

					if (!playing) {
						cursor = -1;
						cursor_move_t = 0;
						rerender();
					}
				}
			});

			canvas.addEventListener("mousedown", (event) => {

				const x = event.offsetX / canvas.offsetWidth * canvas.width;
				const y = event.offsetY / canvas.offsetHeight * canvas.height;

				const note = pos_to_note(x, y);

				if (note) {

					if (note.length == 0) {

						// add note
						note.length = 1;
						notes.push(note);

						selected_t = 3000;
						selected_note = note;

					} else {

						// remove note
						notes.splice(notes.indexOf(note), 1);
					}
				}

				rerender();
			});

			canvas.addEventListener("mousemove", (event) => {

				if (!selected_note)
					return;

				const x = event.offsetX / canvas.offsetWidth * canvas.width;
				const y = event.offsetY / canvas.offsetHeight * canvas.height;

				const note = pos_to_note(x, y, false);

				if (!note)
					return;

				const new_length = note.beat - selected_note.beat + 1;

				if (new_length != selected_note.length && new_length >= 1) {

					selected_note.length = new_length;
					rerender();
				}
			});

			document.addEventListener("mouseup", (event) => {

				if (!selected_note)
					return;

				// check if the selected note is covering any other notes
				for (const note of notes) {

					if (note == selected_note)
						continue;

					if (note.degree == selected_note.degree && (
						   (note.beat                   >= selected_note.beat && note.beat                   < selected_note.beat + selected_note.length)
						|| (note.beat + note.length - 1 >= selected_note.beat && note.beat + note.length - 1 < selected_note.beat + selected_note.length)
					))
						notes.splice(notes.indexOf(note), 1);
				}

				selected_note = null;
				rerender();
			});

			const audioContext = new (window.AudioContext || window.webkitAudioContext)();
			const scriptProcessor = audioContext.createScriptProcessor(256, 1, 1); // generates audio data with 256 samples

			scriptProcessor.connect(audioContext.destination); // connect to speaker

			scriptProcessor.onaudioprocess = (event) => {

				const output = event.outputBuffer.getChannelData(0);

				const relevant_notes = [];
				
				for (const note of notes) {

					if (note.beat <= cursor && note.beat + note.length > cursor)
						relevant_notes.push(note);
				}

				if (selected_t > 0 && selected_note) {
					
					relevant_notes.push(selected_note);
				}

				for (let i = 0; i < output.length; i++) {

					output[i] = 0;
					
					for (const note of relevant_notes)
						output[i] += Math.sign(Math.sin(Math.pow(2.0, (note.degree + base_octave * 17) / 17.0) * 2.0 * Math.PI * (t + i) / audioContext.sampleRate)) * 0.3;
				}

				t += output.length;
				selected_t -= output.length;

				if (playing) {

					cursor_move_t -= output.length;

					if (cursor_move_t <= 0) {
						
						cursor_move_t = audioContext.sampleRate * 60 / bpm;
						cursor = (cursor + 1) % beats_per_bar;
						rerender();
					}
				}
			};
		}

		function note_to_rect(note) {

			if (note.beat < 0 || note.beat >= beats_per_bar || note.degree < 0 || note.degree > 17 + 17)
				return null;

			const this_x = Math.floor( note.beat                * (render.canvas.width - 1) / beats_per_bar) + 1;
			const next_x = Math.floor((note.beat + note.length) * (render.canvas.width - 1) / beats_per_bar) + 1;

			const this_y = Math.floor((1 - (note.degree + 1) / 35) * (render.canvas.height - 1)) + 1;
			const next_y = Math.floor((1 - (note.degree)     / 35) * (render.canvas.height - 1)) + 1;

			return {
				x: this_x,
				y: this_y,
				w: next_x - this_x - 1,
				h: next_y - this_y - 1
			};
		}

		function pos_to_note(x, y, lookup_existing = true) {

			if (x < 0 || x > render.canvas.width - 1 || y < 0 || y > render.canvas.height - 1)
				return null;

			const beat = Math.floor((x - 1) * beats_per_bar / (render.canvas.width - 1));
			const degree = Math.floor((1 - y / (render.canvas.height - 1)) * 35);

			// return the existing note at that position, or create one if one doesn't exist
			if (lookup_existing) {

				for (const note of notes) {

					if (note.degree == degree && note.beat <= beat && note.beat + note.length > beat)
						return note;
				}
			}

			// a length of zero means the note hasn't been inserted into the piano roll
			return { beat, degree, length: 0 };
		}

		function rerender() {

			// render piano roll background
			render.fillStyle = "Black";
			render.fillRect(0, 0, render.canvas.width, render.canvas.height);

			for (let beat = 0; beat < beats_per_bar; beat++) {

				for (let degree = 0; degree < 17 + 17 + 1; degree++) {

					if (degree % 17 == 0) {
						render.fillStyle = beat == cursor ? "#FFBB99" : "#BB7040";
					} else if (degree % 17 == 10) {
						render.fillStyle = beat == cursor ? "#AAAAFF" : "#5555AA";
					} else {
						render.fillStyle = beat == cursor ? "#888888" : "#555555";
					}

					const rect = note_to_rect({ beat, degree, length: 1 });

					render.fillRect(rect.x, rect.y, rect.w, rect.h);
				}
			}

			// render piano roll notes
			for (const note of notes) {

				if (note == selected_note) {
					render.fillStyle = "Yellow";
				} else {
					render.fillStyle = "White";
				}
				
				const rect = note_to_rect(note);
				render.fillRect(rect.x, rect.y, rect.w, rect.h);
			}
		}

		function try_set_bpm(value) {

			if (!isNaN(value) && value >= 1 && value <= 300)
				bpm = Math.floor(value) * 4;

			return "" + (bpm / 4);
		}
	</script>
</head>
<body style="margin: 0; background: black; color: #eee; font-family: sans-serif; font-weight: 700; font-size: 18px;">
	<button id="start" style="position: absolute; left: 50%; top: 50%; font-size: 50px; transform: translate(-50%, -50%); font-family: monospace;" onclick="start();">Start</button>

	<div style="display: flex;">

		<canvas id="canvas" width="601" height="701" style="height: 100vh;"></canvas>
	
		<div>
			<label for="bpm">BPM:</label>
			<input type="text" name="bpm" onchange="value = try_set_bpm(value);" value="120">
		</div>
	</div>
</body>
</html>
