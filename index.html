<!DOCTYPE html>
<html>
<head>
	<meta charset="UTF-8">
	<title>17-TET DAW</title>
	<script>

		let render;
		let t = 0;

		let beats_per_bar = 16;
		let bpm = 120;

		let cursor = -1;
		let cursor_move_t = 0;

		const notes = [
			{ beat: 0, degree: 0, length: 3 },
			{ beat: 1, degree: 6, length: 2 },
			{ beat: 2, degree: 10, length: 1 }
		];

		function start() {

			document.getElementById("start").style.display = "none";

			const canvas = document.getElementById("canvas");
			render = canvas.getContext("2d");

			rerender();

			canvas.addEventListener("click", (event) => {

				const x = event.offsetX / canvas.offsetWidth * canvas.width;
				const y = event.offsetY / canvas.offsetHeight * canvas.height;

				const { beat, degree } = pos_to_note(x, y);

				alert("beat: " + beat + "\ndegree: " + degree);

				rerender();
			});

			const audioContext = new (window.AudioContext || window.webkitAudioContext)();
			const scriptProcessor = audioContext.createScriptProcessor(256, 1, 1); // generates audio data with 256 samples

			scriptProcessor.connect(audioContext.destination); // connect to speaker

			scriptProcessor.onaudioprocess = function (event) {

				const output = event.outputBuffer.getChannelData(0);

				const relevant_notes = [];
				
				for (const note of notes) {

					if (note.beat <= cursor && note.beat + note.length > cursor)
						relevant_notes.push(note);
				}

				for (let i = 0; i < output.length; i++) {

					output[i] = 0;
					
					for (const note of relevant_notes)
						output[i] += Math.sin(Math.pow(2.0, (note.degree + 8 * 17) / 17.0) * 2.0 * Math.PI * (t + i) / audioContext.sampleRate) * 0.3;
				}

				t += output.length;
				cursor_move_t -= output.length;

				if (cursor_move_t <= 0) {
					
					cursor_move_t = audioContext.sampleRate * 60 / bpm;
					cursor = (cursor + 1) % beats_per_bar;
					rerender();
				}
			};
		}

		function note_to_rect(note) {

			if (note.beat < 0 || note.beat >= beats_per_bar || note.degree < 0 || note.degree > 17 + 17)
				return null;

			const this_x = Math.floor(note.beat * 300 / beats_per_bar) + 1;
			const next_x = Math.floor((note.beat + note.length) * 300 / beats_per_bar) + 1;

			return {
				x: this_x,
				y: (17 + 17 - note.degree) * 10 + 1,
				w: next_x - this_x - 1,
				h: 9
			};
		}

		function pos_to_note(x, y) {

			if (x < 0 || x > 300 || y < 0 || y > 10 * (17 + 17 + 1) + 1)
				return null;

			return {
				beat: Math.floor((x - 1) * beats_per_bar / 300),
				degree: Math.ceil((1 - y) / 10 + 17 + 17),
				length: 1
			};
		}

		function rerender() {

			// render piano roll background
			render.fillStyle = "grey";
			render.fillRect(0, 0, 301, 10 * (17 + 17 + 1) + 1);

			for (let beat = 0; beat < beats_per_bar; beat++) {

				for (let degree = 0; degree < 17 + 17 + 1; degree++) {

					if (beat == cursor) {
						render.fillStyle = "white";
					} else if (degree % 17 == 0) {
						render.fillStyle = "orange";
					} else if (degree % 17 == 10) {
						render.fillStyle = "lightBlue";
					} else {
						render.fillStyle = "lightGrey";
					}

					const rect = note_to_rect({ beat, degree, length: 1 });

					render.fillRect(rect.x, rect.y, rect.w, rect.h);
				}
			}

			// render piano roll notes
			render.fillStyle = "white";

			for (const note of notes) {
				
				const rect = note_to_rect(note);
				render.fillRect(rect.x, rect.y, rect.w, rect.h);
			}
		}
	</script>
</head>
<body style="margin: 0;">
	<canvas id="canvas" width="800" height="400" style="width: 100%; image-rendering: pixelated;"></canvas>
	<button id="start" style="position: absolute; left: 50%; top: 50%; font-size: 50px; transform: translate(-50%, -50%); font-family: monospace;" onclick="start();">Start</button>
</body>
</html>
