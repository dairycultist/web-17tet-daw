<!DOCTYPE html>
<html>
<head>
	<meta charset="UTF-8">
	<title>17-TET DAW</title>
	<script>

		let render;
		let t = 0;

		let base_octave = 7;

		let beats_per_bar = 16;
		let bpm = 240;

		let playing = false;
		let cursor = -1;
		let cursor_move_t = 0;

		let selected_t = 0; // for playing audio upon selecting
		let selected_note;

		const tracks = [[]];
		let curr_track_i = 0;

		function start() {

			document.getElementById("start").style.display = "none";

			const canvas = document.getElementById("canvas");
			render = canvas.getContext("2d");

			rerender();

			document.addEventListener("keydown", (event) => {

				if (event.key === ' ') {

					event.preventDefault();

					playing = !playing;

					if (!playing) {
						cursor = -1;
						cursor_move_t = 0;
						rerender();
					}
				}
			});

			canvas.addEventListener("mousedown", (event) => {

				const x = event.offsetX / canvas.offsetWidth * canvas.width;
				const y = event.offsetY / canvas.offsetHeight * canvas.height;

				const note = pos_to_note(x, y);

				if (note) {

					if (note.length == 0) {

						// add note
						note.length = 1;
						tracks[curr_track_i].push(note);

						selected_t = 3000;
						selected_note = note;

					} else {

						// remove note
						tracks[curr_track_i].splice(tracks[curr_track_i].indexOf(note), 1);
					}
				}

				rerender();
			});

			canvas.addEventListener("mousemove", (event) => {

				if (!selected_note)
					return;

				const x = event.offsetX / canvas.offsetWidth * canvas.width;
				const y = event.offsetY / canvas.offsetHeight * canvas.height;

				const note = pos_to_note(x, y, false);

				if (!note)
					return;

				const new_length = note.beat - selected_note.beat + 1;

				if (new_length != selected_note.length && new_length >= 1) {

					selected_note.length = new_length;
					rerender();
				}
			});

			document.addEventListener("mouseup", (event) => {

				if (!selected_note)
					return;

				// check if the selected note is covering any other notes
				for (const note of tracks[curr_track_i]) {

					if (note == selected_note)
						continue;

					if (note.degree == selected_note.degree && (
						   (note.beat                   >= selected_note.beat && note.beat                   < selected_note.beat + selected_note.length)
						|| (note.beat + note.length - 1 >= selected_note.beat && note.beat + note.length - 1 < selected_note.beat + selected_note.length)
					)) {
						tracks[curr_track_i].splice(tracks[curr_track_i].indexOf(note), 1);
					}
				}

				selected_note = null;
				rerender();
			});

			const audioContext = new (window.AudioContext || window.webkitAudioContext)();
			const scriptProcessor = audioContext.createScriptProcessor(256, 1, 1); // generates audio data with 256 samples

			scriptProcessor.connect(audioContext.destination); // connect to speaker

			scriptProcessor.onaudioprocess = (event) => {

				const output = event.outputBuffer.getChannelData(0);

				const relevant_notes = [];
				
				for (const note of tracks[curr_track_i]) {

					if (note.beat <= cursor && note.beat + note.length > cursor)
						relevant_notes.push(note);
				}

				if (selected_t > 0 && selected_note) {
					
					relevant_notes.push(selected_note);
				}

				for (let i = 0; i < output.length; i++) {

					output[i] = 0;
					
					for (const note of relevant_notes) {

						const signal = Math.sign(Math.sin(Math.pow(2.0, (note.degree + base_octave * 17) / 17.0) * 2.0 * Math.PI * (t + i) / audioContext.sampleRate));
						let amplitude = 0.3;

						if (note.beat == cursor) {
							amplitude += 0.3 * cursor_move_t / (audioContext.sampleRate * 60 / bpm);
						}

						output[i] += signal * amplitude;
					}
				}

				t += output.length;
				selected_t -= output.length;

				if (playing) {

					cursor_move_t -= output.length;

					if (cursor_move_t <= 0) {
						
						cursor_move_t = audioContext.sampleRate * 60 / bpm;
						cursor += 1;

						if (cursor >= beats_per_bar) {

							cursor = 0;

							// update which track is selected (this automatically rerenders)
							select_track((curr_track_i + 1) % tracks.length);
						} else {
							rerender();
						}
					}
				}
			};
		}

		function note_to_rect(note) {

			if (note.beat < 0 || note.beat >= beats_per_bar || note.degree < 0 || note.degree > 17 + 17)
				return null;

			const this_x = Math.floor( note.beat                * (render.canvas.width - 1) / beats_per_bar) + 1;
			const next_x = Math.floor((note.beat + note.length) * (render.canvas.width - 1) / beats_per_bar) + 1;

			const this_y = Math.floor((1 - (note.degree + 1) / 35) * (render.canvas.height - 1)) + 1;
			const next_y = Math.floor((1 - (note.degree)     / 35) * (render.canvas.height - 1)) + 1;

			return {
				x: this_x,
				y: this_y,
				w: next_x - this_x - 1,
				h: next_y - this_y - 1
			};
		}

		function pos_to_note(x, y, lookup_existing = true) {

			if (x < 0 || x > render.canvas.width - 1 || y < 0 || y > render.canvas.height - 1)
				return null;

			const beat = Math.floor((x - 1) * beats_per_bar / (render.canvas.width - 1));
			const degree = Math.floor((1 - y / (render.canvas.height - 1)) * 35);

			// return the existing note at that position, or create one if one doesn't exist
			if (lookup_existing) {

				for (const note of tracks[curr_track_i]) {

					if (note.degree == degree && note.beat <= beat && note.beat + note.length > beat)
						return note;
				}
			}

			// a length of zero means the note hasn't been inserted into the piano roll
			return { beat, degree, length: 0 };
		}

		function rerender() {

			// render piano roll background
			render.fillStyle = "Black";
			render.fillRect(0, 0, render.canvas.width, render.canvas.height);

			for (let beat = 0; beat < beats_per_bar; beat++) {

				for (let degree = 0; degree < 17 + 17 + 1; degree++) {

					if (degree % 17 == 0) {
						render.fillStyle = beat == cursor ? "#FFBB99" : "#BB7040";
					} else if (degree % 17 == 10) {
						render.fillStyle = beat == cursor ? "#AAAAFF" : "#5555AA";
					} else {
						render.fillStyle = beat == cursor ? "#888888" : Math.floor(beat / 4) % 2 == 0 ? "#555555" : "#444444";
					}

					const rect = note_to_rect({ beat, degree, length: 1 });

					render.fillRect(rect.x, rect.y, rect.w, rect.h);
				}
			}

			// render piano roll notes
			for (const note of tracks[curr_track_i]) {

				if (note == selected_note) {
					render.fillStyle = "Yellow";
				} else {
					render.fillStyle = "White";
				}
				
				const rect = note_to_rect(note);
				render.fillRect(rect.x, rect.y, rect.w, rect.h);
			}
		}

		function try_set_bpm(value) {

			if (!isNaN(value))
				bpm = Math.max(1, Math.min(300, Math.floor(value))) * 4;

			return "" + (bpm / 4);
		}

		function select_track(track_i) {

			document.getElementById("track_" + curr_track_i).classList.remove("selected");
			curr_track_i = track_i;
			document.getElementById("track_" + curr_track_i).classList.add("selected");

			rerender();
		}

		function add_track() {

			tracks.push([]);
			document.getElementById("tracks").innerHTML += `
				<div id="track_${ tracks.length - 1 }" class="track">
					<button type="button" onclick="swap_track_left(${ tracks.length - 1 });"><-</button>
					${ tracks.length }
					<button type="button" onclick="swap_track_right(${ tracks.length - 1 });">-></button>
					<br>
					<button type="button" onclick="select_track(${ tracks.length - 1 });">Select</button>
				</div>
			`;
		}

		function delete_selected_track() {

			if (tracks.length == 1) {

				alert("Can't delete only track!");
				return;
			}

			tracks.splice(curr_track_i, 1);

			select_track(Math.min(curr_track_i, tracks.length - 1));

			document.getElementById("track_" + tracks.length).remove();
		}

		function swap_track_left(track_i) {

			if (track_i <= 0) {

				alert("Can't move any more left!");
				return;
			}

			[tracks[track_i], tracks[track_i - 1]] = [tracks[track_i - 1], tracks[track_i]];

			select_track(track_i - 1);
		}

		function swap_track_right(track_i) {

			if (track_i >= tracks.length - 1) {

				alert("Can't move any more right!");
				return;
			}

			[tracks[track_i], tracks[track_i + 1]] = [tracks[track_i + 1], tracks[track_i]];

			select_track(track_i + 1);
		}
	</script>
	<style>
		.track {
			background: grey;
			color: black;
			padding: 4px;
		}

		.track.selected {
			background: lightgrey;
		}
	</style>
</head>
<body style="margin: 0; background: black; color: #eee; font-family: sans-serif; font-weight: 700; font-size: 18px;">
	<button type="button" id="start" style="position: absolute; left: 50%; top: 50%; font-size: 50px; transform: translate(-50%, -50%); font-family: monospace;" onclick="start();">Start</button>

	<div style="display: flex;">

		<canvas id="canvas" width="601" height="701" style="height: 100vh;"></canvas>
	
		<div>
			<label for="bpm">BPM:</label>
			<input type="text" name="bpm" onchange="value = try_set_bpm(value);" value="60">

			<br><br>

			<div style="display: flex; gap: 1em;">
				<div style="display: flex; gap: 1em;" id="tracks">
					<div id="track_0" class="track selected">
						<button type="button" onclick="swap_track_left(0);"><-</button>
						1
						<button type="button" onclick="swap_track_right(0);">-></button>
						<br>
						<button type="button" onclick="select_track(0);">Select</button>
					</div>
				</div>
				<button type="button" onclick="add_track();">Add</button>
			</div>

			<br><br><br><br>
			<button type="button" onclick="delete_selected_track();">Delete selected track</button>
		</div>
	</div>
</body>
</html>
